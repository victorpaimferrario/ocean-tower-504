name: Keep-alive Supabase

# Mantem o projeto Supabase (plano gratis) ativo, evitando a pausa por inatividade.
#
# HISTORICO: ate 22/09/2026 este robo fazia apenas um GET. Ele rodou todo dia e
# respondeu 200 todo dia — e o projeto foi pausado assim mesmo (e-mail da Supabase
# em 22/09). Ou seja: LEITURA ANONIMA NAO CONTA como atividade para eles.
# Agora o ping faz uma ESCRITA de verdade (UPDATE de um timestamp) numa tabela
# isolada, `ocean504_heartbeat`, criada so para isso: uma unica linha, sem dado
# sensivel, onde o anonimo so pode dar UPDATE (nao pode inserir nem apagar).
#
# Totalmente automatico — nao exige nenhuma acao.

on:
  schedule:
    - cron: '23 9 * * *'      # ~09:23 UTC (~06:23 de Brasilia)
    - cron: '23 21 * * *'     # ~21:23 UTC (~18:23 de Brasilia)
  workflow_dispatch:           # botao "Run workflow" para rodar na hora

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Escrever heartbeat no Supabase (escrita conta como atividade)
        run: |
          set -euo pipefail
          API="https://aipgtnvflezqnhzbpxam.supabase.co/rest/v1"
          KEY="sb_publishable_t3S6My3JAie5UPwfc5SvNg_lH78ZbLf"
          AGORA="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          CODE=$(curl -sS -o resposta.json -w "%{http_code}" \
            -X PATCH "$API/ocean504_heartbeat?id=eq.1" \
            -H "apikey: $KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "{\"ts\":\"$AGORA\",\"origem\":\"github-actions\"}")

          echo "Supabase respondeu: $CODE"
          cat resposta.json || true
          echo

          if [ "$CODE" != "200" ]; then
            echo "::error::Heartbeat falhou (esperado 200, recebeu $CODE). \
          Se for 000/503/521 o projeto provavelmente esta PAUSADO — religue em \
          https://supabase.com/dashboard/project/aipgtnvflezqnhzbpxam"
            exit 1
          fi

          # confere que o timestamp realmente mudou (200 sem gravar seria pior que erro)
          if ! grep -q "$(date -u +%Y-%m-%d)" resposta.json; then
            echo "::error::Respondeu 200 mas o timestamp nao foi gravado."
            exit 1
          fi
          echo "Heartbeat gravado — projeto Supabase ativo."
