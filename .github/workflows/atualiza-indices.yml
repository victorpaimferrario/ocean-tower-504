name: Atualiza indices (IPCA/CDI)

# Puxa as series mensais REAIS do Banco Central (SGS) e grava em indices.json.
# O painel usa esses valores para corrigir cada desembolso pelo indice REALIZADO
# de cada mes. E a fonte do indicador "Meu dinheiro, mes a mes".
#   IPCA  -> serie 433  (variacao mensal, % a.m.)
#   CDI   -> serie 4391 (CDI acumulado no mes, % a.m.)
#
# O QUE MUDA EM CADA DIA: no dia 1 fecha o CDI do mes que acabou (a serie 4391 e
# "acumulado no mes" e vem PARCIAL enquanto o mes corre); por volta do dia 10 o
# IBGE publica o IPCA. Nos demais dias o robo roda, nao encontra novidade e nao
# comita — e barato e garante que nenhuma falha isolada fique dias no ar.
#
# POR QUE RETRY: em 01/10/2026 este robo FALHOU (exit 1) e ninguem soube. A API
# do BCB cai com frequencia, e o script nao tinha nenhuma tolerancia: uma falha
# de rede derrubava a atualizacao do mes inteiro, e a proxima tentativa so viria
# dia 12. O painel ficou 5 dias exibindo setembro com o valor PARCIAL de 0,72%.
# Agora: 4 tentativas por serie com espera crescente, e — mais importante — o
# arquivo bom NUNCA e substituido por um pior. Se o BCB nao responder, o robo
# falha SEM escrever, preservando o indices.json que ja estava certo.

# POR QUE DIARIO: rodar so nos dias 1 e 12 significa que uma falha custa ate
# onze dias de dado errado no ar — foi o que aconteceu em 01/10. Rodando todo
# dia, qualquer falha se resolve sozinha na manha seguinte. O custo e nenhum: o
# passo de commit so grava quando o conteudo muda, entao nos dias em que o BCB
# nao publicou nada o robo roda, compara e nao faz commit algum.
on:
  schedule:
    - cron: '28 9 * * *'      # todo dia ~09:28 UTC (~06:28 de Brasilia)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Buscar IPCA e CDI no BCB e gravar indices.json
        run: python3 scripts/atualiza_indices.py

      - name: Commitar se mudou
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add indices.json
          git diff --staged --quiet && { echo "nada mudou"; exit 0; }
          git commit -m "Atualiza indices IPCA/CDI - $(date -u +%Y-%m-%d)"
          # dois workflows podem commitar este arquivo; rebase antes de empurrar
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push falhou, tentativa $i"; sleep $((i*5))
          done
          exit 1
